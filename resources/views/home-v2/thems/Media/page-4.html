<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Carré avec Popup YouTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px 10px;
        }
        
        .container {
            /* max-width: 1200px; */
            margin: 0 auto;
        }
        
        .slider-container {
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            background: white;
            margin-bottom: 20px;
            border: 1px solid #e1e8f0;
            height: 450px; /* Hauteur réduite */
        }
        
        .slider-track {
            display: flex;
            transition: transform 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Transition plus lente */
            height: 100%;
        }
        
        .slider-slide {
            display: flex;
            flex: 0 0 100%;
            height: 100%; /* Utilise toute la hauteur du container */
        }
        
        .column {
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .column:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        
        .col-6 {
            width: 50%;
        }
        
        /* Styles pour les carreaux (carrés) */
        .single-square {
            position: relative;
            height: 100%;
        }
        
        .square-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100%;
        }
        
        .square-item {
            position: relative;
            overflow: hidden;
        }
        
        /* Styles pour les images dans les carrés */
        .square-item img, .single-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: black;
            opacity: 0.6;
            padding: 10px 15px 10px;
            color: white;
            transform: translateY(0);
            transition: transform 0.4s ease;
        }
        
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4757;
            color: white;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 5;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .badge.new {
            background: #ff4757;
        }
        
        .badge.hot {
            background: #ff9f1a;
        }
        
        .badge.trending {
            background: #2ed573;
        }
        
        .badge.popular {
            background: #1e90ff;
        }
        
        .image-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            position: relative;
            padding-top: 5px;
        }
        
        .image-description {
            font-size: 0.75rem;
            opacity: 0.9;
            line-height: 1.2;
        }
        
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            visibility: hidden;
        }
        
        .image-item:hover .play-btn {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .play-btn:hover {
            background: rgba(200, 0, 0, 0.95);
            transform: translate(-50%, -50%) scale(1.1);
            border-color: rgba(255, 255, 255, 0.6);
        }
        
        .slider-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .slider-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(74, 111, 165, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .slider-dots {
            display: contents;
        }
        
        .slider-dot.active {
            background: #4a6fa5;
            transform: scale(1.2);
        }
        
        .nav-btn {
            background: white;
            border: 2px solid #e1e8f0;
            color: #4a6fa5;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
        }
        
        .nav-btn:hover {
            background: #4a6fa5;
            color: white;
            border-color: #4a6fa5;
            transform: scale(1.1);
            box-shadow: 0 5px 12px rgba(74, 111, 165, 0.3);
        }
        
        /* Modal (Popup) Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        
        .modal-content {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }
        
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e1e8f0;
        }
        
        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }
        
        .close-modal {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
            line-height: 1;
        }
        
        .close-modal:hover {
            color: #e74c3c;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .image-item:hover img {
            transform: scale(1.05);
        }
        
        .image-item:hover .image-overlay {
            transform: translateY(0);
        }
        
        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .slider-container {
                height: 300px;
            }
            
            .slider-slide {
                flex-direction: column;
            }
            
            .col-6 {
                width: 100%;
                height: 50%;
            }
            
            .square-images {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .slider-container {
                height: 400px;
            }
            
            .slider-slide {
                flex-direction: column;
            }
            
            .col-6 {
                width: 100%;
                height: 50%;
            }
            
            .square-images {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }
            
            .image-title {
                font-size: 0.9rem;
            }
            
            .play-btn {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .slider-container {
                height: 350px;
            }
            
            .square-images {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }
            
            .image-title {
                font-size: 0.8rem;
            }
            
            .badge {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            
            .image-description {
                display: none;
            }
            
            .play-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            body {
                padding: 15px 5px;
            }
        }
    </style>
</head>

        // Variables du slider

        let isTransitioning = false;
        const slideDuration = 8000; // 8 secondes entre les slides
        const transitionDuration = 1500; // 1.5 secondes pour la transition

        // Initialisation du slider avec duplication des slides pour un effet infini
        function initSlider() {
            const sliderTrack = document.getElementById('sliderTrack');
            const sliderDots = document.getElementById('sliderDots');
            
            // Dupliquer les slides pour créer un effet infini
            // On ajoute les slides 2 fois pour avoir assez de contenu pour le défilement continu
            const slidesToShow = slidesData.concat(slidesData);
            
            slidesToShow.forEach((slide, index) => {
                const slideElement = document.createElement('div');
                slideElement.className = 'slider-slide';
                
                // TOUJOURS grand carré à gauche, 4 petits carrés à droite
                slideElement.innerHTML = `
                    <div class="column col-6 single-square image-item" data-video-id="${slide.largeImage.videoId}" data-title="${slide.largeImage.title}">
                        ${slide.largeImage.badge ? `<div class="badge ${slide.largeImage.badge}">${slide.largeImage.badge}</div>` : ''}
                        <img src="${slide.largeImage.image}" alt="${slide.largeImage.title}">
                        <div class="image-overlay">
                            <div class="image-title">${slide.largeImage.title}</div>
                            <div class="image-description">${slide.largeImage.description}</div>
                        </div>
                        <div class="play-btn">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="column col-6 square-images">
                        ${slide.smallImages.map(img => `
                            <div class="square-item image-item" data-video-id="${img.videoId}" data-title="${img.title}">
                                ${img.badge ? `<div class="badge ${img.badge}">${img.badge}</div>` : ''}
                                <img src="${img.image}" alt="${img.title}">
                                <div class="image-overlay">
                                    <div class="image-title">${img.title}</div>
                                    <div class="image-description">${img.description}</div>
                                </div>
                                <div class="play-btn">
                                    <i class="fas fa-play"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                sliderTrack.appendChild(slideElement);
            });
            
            // Créer les points de navigation (seulement pour les slides originaux)
            slidesData.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = `slider-dot ${index === 0 ? 'active' : ''}`;
                dot.dataset.index = index;
                dot.addEventListener('click', () => goToSlide(index));
                sliderDots.appendChild(dot);
            });
            
            // Définir la vitesse de transition dans le CSS
            sliderTrack.style.transition = `transform ${transitionDuration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
            
            // Ajouter les écouteurs d'événements pour les boutons play
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const imageItem = this.closest('.image-item');
                    const videoId = imageItem.dataset.videoId;
                    const title = imageItem.dataset.title;
                    openVideoModal(videoId, title);
                });
            });
            
            // Ajouter les écouteurs d'événements pour les images
            document.querySelectorAll('.image-item').forEach(item => {
                item.addEventListener('click', function() {
                    const videoId = this.dataset.videoId;
                    const title = this.dataset.title;
                    openVideoModal(videoId, title);
                });
            });
            
            // Mettre à jour l'affichage du slider
            updateSlider();
            
            // Démarrer le défilement automatique
            startAutoSlide();
        }

        // Aller à un slide spécifique
        function goToSlide(slideIndex) {
            if (isTransitioning) return;
            isTransitioning = true;
            
            currentSlide = slideIndex;
            updateSlider();
            resetAutoSlide();
            
            // Réinitialiser le drapeau après la transition
            setTimeout(() => {
                isTransitioning = false;
            }, transitionDuration);
        }

        // Passer au slide suivant avec défilement continu infini
        function nextSlide() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            currentSlide++;
            
            // Calculer l'index réel pour les points de navigation
            const realIndex = currentSlide % slidesData.length;
            
            // Mettre à jour les points de navigation
            document.querySelectorAll('.slider-dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === realIndex);
            });
            
            // Si on approche de la fin du track dupliqué, réinitialiser discrètement
            if (currentSlide >= slidesData.length * 2 - 1) {
                // Faire une transition très rapide vers le début
                const sliderTrack = document.getElementById('sliderTrack');
                sliderTrack.style.transition = 'none';
                currentSlide = slidesData.length;
                updateSlider();
                
                // Forcer un reflow
                void sliderTrack.offsetWidth;
                
                // Revenir à l'animation normale
                sliderTrack.style.transition = `transform ${transitionDuration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                
                // Passer au slide suivant après un court délai
                setTimeout(() => {
                    currentSlide++;
                    updateSlider();
                    
                    // Réinitialiser le drapeau après la transition
                    setTimeout(() => {
                        isTransitioning = false;
                    }, transitionDuration);
                }, 50);
            } else {
                updateSlider();
                
                // Réinitialiser le drapeau après la transition
                setTimeout(() => {
                    isTransitioning = false;
                }, transitionDuration);
            }
        }

        // Passer au slide précédent avec défilement continu infini
        function prevSlide() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            currentSlide--;
            
            // Calculer l'index réel pour les points de navigation
            const realIndex = (currentSlide + slidesData.length) % slidesData.length;
            
            // Mettre à jour les points de navigation
            document.querySelectorAll('.slider-dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === realIndex);
            });
            
            if (currentSlide < 0) {
                // Sauter discrètement à la fin du track dupliqué
                const sliderTrack = document.getElementById('sliderTrack');
                sliderTrack.style.transition = 'none';
                currentSlide = slidesData.length * 2 - 2;
                updateSlider();
                
                // Forcer un reflow
                void sliderTrack.offsetWidth;
                
                // Revenir à l'animation normale
                sliderTrack.style.transition = `transform ${transitionDuration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                
                // Passer au slide précédent après un court délai
                setTimeout(() => {
                    currentSlide--;
                    updateSlider();
                    
                    // Réinitialiser le drapeau après la transition
                    setTimeout(() => {
                        isTransitioning = false;
                    }, transitionDuration);
                }, 50);
            } else {
                updateSlider();
                
                // Réinitialiser le drapeau après la transition
                setTimeout(() => {
                    isTransitioning = false;
                }, transitionDuration);
            }
            
            resetAutoSlide();
        }

        // Mettre à jour l'affichage du slider
        function updateSlider() {
            const sliderTrack = document.getElementById('sliderTrack');
            const translateX = -currentSlide * 100;
            
            sliderTrack.style.transform = `translateX(${translateX}%)`;
        }

        // Ouvrir la modal vidéo
        function openVideoModal(videoId, title) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('youtubeFrame');
            const modalTitle = document.getElementById('modalTitle');
            
            // Mettre à jour le titre et l'iframe
            modalTitle.textContent = title;
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            
            // Afficher la modal
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Arrêter le défilement automatique quand une vidéo est ouverte
            clearInterval(autoSlideInterval);
        }

        // Fermer la modal vidéo
        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('youtubeFrame');
            
            // Cacher la modal et réinitialiser l'iframe
            modal.classList.remove('active');
            iframe.src = '';
            document.body.style.overflow = 'auto';
            
            // Redémarrer le défilement automatique quand la modal est fermée
            resetAutoSlide();
        }

        // Démarrer le défilement automatique
        function startAutoSlide() {
            autoSlideInterval = setInterval(nextSlide, slideDuration);
        }

        // Réinitialiser le défilement automatique
        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }

        // Initialisation lorsque la page est chargée
        document.addEventListener('DOMContentLoaded', function() {
            initSlider();
            
            // Écouteurs d'événements pour les boutons de navigation
            document.getElementById('prevBtn').addEventListener('click', () => {
                prevSlide();
                resetAutoSlide();
            });
            
            document.getElementById('nextBtn').addEventListener('click', () => {
                nextSlide();
                resetAutoSlide();
            });
            
            // Écouteur d'événement pour fermer la modal
            document.getElementById('closeModal').addEventListener('click', closeVideoModal);
            document.getElementById('videoModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeVideoModal();
                }
            });
            
            // Arrêter le défilement automatique quand la souris est sur le slider
            document.querySelector('.slider-container').addEventListener('mouseenter', () => {
                clearInterval(autoSlideInterval);
            });
            
            // Redémarrer le défilement automatique quand la souris quitte le slider
            document.querySelector('.slider-container').addEventListener('mouseleave', () => {
                startAutoSlide();
            });
            
            // Démarrer le défilement automatique après un court délai
            setTimeout(() => {
                startAutoSlide();
            }, 2000);
        });

        // Gérer la touche Échap pour fermer la modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeVideoModal();
            }
        });
    </script>
</body>
</html>
